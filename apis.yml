name: Thruster
description: >-
  Thruster was a yield-first decentralized exchange (DEX) built natively on the
  Blast Ethereum Layer 2, offering Uniswap-style v2 and v3 concentrated
  liquidity AMMs, a stableswap AMM, and a token launchpad. Backed by Pantera
  Capital, the protocol shut down on July 29, 2025 after completing THRUST
  holder redemptions; its thruster.finance website is offline, while the
  GitBook documentation and the ThrusterX GitHub organization (Solidity
  contracts and audit reports) remain the surviving public record. No REST/HTTP
  API was published; the developer surface was on-chain smart contracts on
  Blast.
